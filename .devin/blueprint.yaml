# https://docs.devin.ai/onboard-devin/environment/git-backed-blueprints
# Linux: verified 2026-09-11 on a Devin Ubuntu 22.04 x86_64 VM (see README "Verified").
initialize: |
  # PulseAudio null sinks are the BlackHole equivalent (created per session by scripts/linux_audio.sh).
  sudo apt-get install -y pulseaudio pulseaudio-utils espeak-ng
  # Zoom desktop client (Zoom Workplace) -> /usr/bin/zoom
  curl -sL -o /tmp/zoom_amd64.deb https://zoom.us/client/latest/zoom_amd64.deb
  sudo apt-get install -y /tmp/zoom_amd64.deb
  rm -f /tmp/zoom_amd64.deb
knowledge:
  - name: create meeting (parent)
    contents: |
      python3 scripts/zoom_meeting.py --topic "Devin standup" --duration 60 --json
  - name: join meeting (child)
    contents: |
      scripts/join_zoom.sh "<join_url or web_client_url>" "Devin 2"   # Zoom desktop app; runs linux_audio.sh first
      # computer use: DISPLAY=:0 wmctrl -a "<topic>"; Join; Audio ^ -> mic DevinMicSrc, speaker ZoomOut
  - name: speak into the Zoom mic
    contents: |
      PULSE_SINK=devin_mic espeak-ng "hello from Devin"      # or paplay --device=devin_mic tts.wav
      # More > Show captions transcribes it; Zoom output is on zoom_out.monitor (parecord --device=zoom_out.monitor)
  - name: end meeting (parent, when the demo is over)
    contents: |
      python3 scripts/zoom_meeting.py --end <id>   # --list-live finds stragglers
  - name: notes
    contents: |
      Zoom secrets (ZOOM_S2S_*, ZOOM_HOST_EMAIL) are personal-scoped: present in sessions, not in builds.
---
# macOS: verified 2026-09-11 on a Devin macOS 26 arm64 VM (see README "Verified").
runs-on: macos
initialize: |
  # Virtual audio devices: 2ch = Zoom mic input (TTS goes here), 16ch = Zoom speaker output.
  brew install --cask blackhole-2ch blackhole-16ch
  sudo killall coreaudiod
  brew install switchaudio-osx
  # Zoom desktop client; the default Zoom.pkg is x86_64-only and fails with "Bad CPU type" on arm64.
  curl -sL -o /tmp/Zoom-arm64.pkg "https://zoom.us/client/latest/Zoom.pkg?archType=arm64"
  sudo installer -pkg /tmp/Zoom-arm64.pkg -target /
  rm -f /tmp/Zoom-arm64.pkg
knowledge:
  - name: audio devices
    contents: |
      system_profiler SPAudioDataType          # expect BlackHole 2ch + BlackHole 16ch
      SwitchAudioSource -s "BlackHole 2ch"     # system output -> Zoom mic
      say "hello from Devin"                   # Zoom mic level should move; More > Show captions transcribes it
  - name: join meeting (child)
    contents: |
      scripts/join_zoom.sh "<join_url>" "Devin 1"    # Zoom desktop app via zoommtg://; ZOOM_JOIN_MODE=safari for the web client
---
# Windows: verified 2026-09-11 on a Devin Windows Server 2022 x64 VM (see README "Verified").
# No reboot was needed: both VB-Audio drivers enumerate right after their silent installer exits.
# Every step below re-ran green on the same VM (idempotent); the whole block takes ~20 s with a warm CDN.
runs-on: windows
shell: powershell
initialize:
  - name: audio stack (the VM boots with Audiosrv disabled and zero endpoints)
    run: |
      Set-Service AudioEndpointBuilder -StartupType Automatic; Start-Service AudioEndpointBuilder
      Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv
      Install-Module AudioDeviceCmdlets -Force -Scope CurrentUser
  - name: VB-CABLE pack 45 = Zoom mic ("CABLE Input" playback -> "CABLE Output" recording)
    run: |
      # The chocolatey vb-cable package (pack 43) installs but enumerates nothing on Server 2022; pack 45 works.
      # The installers' exit codes are not documented, so the step asserts on the PnP device instead.
      if (-not (Get-PnpDevice -Class MEDIA -FriendlyName 'VB-Audio Virtual Cable' -ErrorAction SilentlyContinue)) {
        curl.exe -sfL -o $HOME\VBCABLE_Driver_Pack45.zip https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip
        Expand-Archive -Force $HOME\VBCABLE_Driver_Pack45.zip $HOME\vbcable45
        Start-Process -Wait -FilePath $HOME\vbcable45\VBCABLE_Setup_x64.exe -ArgumentList '-i','-h' -WorkingDirectory $HOME\vbcable45
        Remove-Item -Recurse -Force $HOME\VBCABLE_Driver_Pack45.zip, $HOME\vbcable45
      }
      if (-not (Get-PnpDevice -Class MEDIA -FriendlyName 'VB-Audio Virtual Cable' -ErrorAction SilentlyContinue)) { throw 'VB-CABLE did not install' }
  - name: Hi-Fi Cable = Zoom speaker (second, independent cable so meeting audio cannot loop into the mic)
    run: |
      # 2015 driver signed by VB-Audio only: trusting the publisher for the duration of the install is what makes
      # -h (hidden) truly unattended; the exact cert is removed again right after, but only if this step added it
      # (the installed driver keeps working without it).
      # Not idempotent: running -i on an installed Hi-Fi Cable removes it, hence the guard.
      if (-not (Get-PnpDevice -Class MEDIA -FriendlyName 'VB-Audio Hi-Fi Cable' -ErrorAction SilentlyContinue)) {
        $cer = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList (Resolve-Path scripts\windows\vb-audio-driver-signer.cer).Path
        $trust = "Cert:\LocalMachine\TrustedPublisher\$($cer.Thumbprint)"
        $addedTrust = -not (Test-Path $trust)
        if ($addedTrust) { certutil -addstore -f TrustedPublisher scripts\windows\vb-audio-driver-signer.cer }
        curl.exe -sfL -o $HOME\HiFiCable.zip https://download.vb-audio.com/Download_CABLE/HiFiCableAsioBridgeSetup_v1007.zip
        Expand-Archive -Force $HOME\HiFiCable.zip $HOME\hificable
        Start-Process -Wait -FilePath $HOME\hificable\HiFiCableAsioBridgeSetup.exe -ArgumentList '-i','-h' -WorkingDirectory $HOME\hificable
        Remove-Item -Recurse -Force $HOME\HiFiCable.zip, $HOME\hificable
        if ($addedTrust) { Remove-Item $trust }
      }
      if (-not (Get-PnpDevice -Class MEDIA -FriendlyName 'VB-Audio Hi-Fi Cable' -ErrorAction SilentlyContinue)) { throw 'Hi-Fi Cable did not install' }
  - name: defaults (system output -> CABLE Input so TTS lands in the Zoom mic) + desktop-app microphone access
    run: |
      Import-Module AudioDeviceCmdlets
      Set-AudioDevice -ID (Get-AudioDevice -List | Where-Object { $_.Type -eq 'Playback' -and $_.Name -like 'CABLE Input*' }).ID | Out-Null
      Set-AudioDevice -ID (Get-AudioDevice -List | Where-Object { $_.Type -eq 'Recording' -and $_.Name -like 'CABLE Output*' }).ID | Out-Null
      $cs = 'SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
      foreach ($k in "HKLM:\$cs", "HKCU:\$cs", "HKCU:\$cs\NonPackaged") { New-Item -Force $k | Out-Null; Set-ItemProperty $k -Name Value -Value Allow }
  - name: Zoom desktop client, 64-bit -> C:\Program Files\Zoom\bin\Zoom.exe
    run: |
      # The unsuffixed ZoomInstallerFull.msi is the 32-bit build (Program Files (x86), "upgrade to 64-bit" nag).
      $zoom = 'C:\Program Files\Zoom\bin\Zoom.exe'
      if (-not (Test-Path $zoom)) {
        curl.exe -sfL -o $HOME\ZoomInstallerFull-x64.msi "https://zoom.us/client/latest/ZoomInstallerFull.msi?archType=x64"
        $p = Start-Process -Wait -PassThru msiexec -ArgumentList '/i', "$HOME\ZoomInstallerFull-x64.msi", '/qn', '/norestart'
        Remove-Item $HOME\ZoomInstallerFull-x64.msi
        if ($p.ExitCode -notin 0, 3010) { throw "msiexec exit $($p.ExitCode)" }
      }
      if (-not (Test-Path $zoom)) { throw 'Zoom.exe missing after install' }
knowledge:
  - name: audio devices
    contents: |
      Get-AudioDevice -List     # expect CABLE Input/CABLE Output (mic cable) + Hi-Fi Cable Input/Output (speaker cable)
      Add-Type -AssemblyName System.Speech; (New-Object System.Speech.Synthesis.SpeechSynthesizer).Speak("hello from Devin")
      # plays on the default output = CABLE Input -> Zoom mic level moves; More > Show captions transcribes it
  - name: join meeting (child)
    contents: |
      Start-Process "zoommtg://zoom.us/join?confno=<id>&pwd=<enc>&uname=Devin%20Win"   # then computer use: Join
      # Zoom Settings > Audio: speaker = Hi-Fi Cable Input, microphone = CABLE Output (never "Same as system" for both)
